[package]
name = "zola-tool"
version = "0.1.0"
edition = "2024"
description = "TUI to manage posts of the Zola blog (list / create / rename / edit / delete)"

[[bin]]
name = "zola-tool"
path = "src/main.rs"

[features]
# A local writing assistant (review / plan / draft a post) running the biv
# inference engine. Off by default: `cargo build --release --features biv`.
biv = ["dep:biv", "dep:biv-cli", "dep:rayon"]

[dependencies]
# line_count: where wrapped text puts the images of the preview
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
pulldown-cmark = { version = "0.13", default-features = false }
# images in the preview: drawn with the kitty, Sixel or iTerm2 protocol
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# the formats the preview decodes
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# the inference engine, and its GGUF / Hugging Face cache helpers
biv = { git = "https://github.com/vincenthz/biv", optional = true }
biv-cli = { git = "https://github.com/vincenthz/biv", optional = true }
rayon = { version = "1.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
biv = { git = "https://github.com/vincenthz/biv", optional = true, features = ["metal"] }

[profile.dev.package."*"]
# unoptimized quantized kernels make inference unusably slow in debug builds
opt-level = 3

[profile.release]
opt-level = 2
